<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNX Partner Leads</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--muted:#5d6b7a;--line:#dde2e8;--brand:#1f3a5f;--on-brand:#fff;--accent:#e8f0fa;
--p5:#0b7a3e;--p4:#3a8f2f;--p3:#9a7b00;--p2:#b35c00;--p1:#a12d2d;--knx:#5b3fa8;--on-prio:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161d;--card:#1a212b;--ink:#e6ebf1;--muted:#9aa7b5;--line:#2c3644;--brand:#8fb4e3;--on-brand:#11161d;--accent:#22324a;--knx:#b39cf0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161d;--card:#1a212b;--ink:#e6ebf1;--muted:#9aa7b5;--line:#2c3644;--brand:#8fb4e3;--on-brand:#11161d;--accent:#22324a;--knx:#b39cf0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:17px;margin:0 0 6px}
.sub{color:var(--muted);font-size:12px}
.counters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.counters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;background:var(--bg);cursor:pointer}
.chip b{font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--brand)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.filters input,.filters select,.btn,textarea,select.status{font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.filters .search{grid-column:1/-1}
.ftoggle{display:none;margin:8px 16px 0}
@media (max-width:640px){.ftoggle{display:inline-block}.filters.collapsed>*:not(.search){display:none}}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;align-items:center}
.btn{width:auto;cursor:pointer;background:var(--card)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
main{padding:0 16px 40px;max-width:1100px;margin:0 auto}
.count{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.top{display:flex;gap:10px;align-items:flex-start}
.prio{flex:none;width:34px;height:34px;border-radius:8px;color:var(--on-prio);font-weight:700;display:grid;place-items:center}
.p5{background:var(--p5)}.p4{background:var(--p4)}.p3{background:var(--p3)}.p2{background:var(--p2)}.p1{background:var(--p1)}
.name{font-weight:650;font-size:16px;word-break:break-word}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:11.5px;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--muted)}
.tag.knx{color:var(--knx);border-color:var(--knx)}
.tag.warn{color:var(--p2);border-color:var(--p2)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.actions a{text-decoration:none;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:var(--bg);word-break:break-all}
.actions a.call{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
.actions .btn{padding:8px 10px}
.rec{font-size:13px;background:var(--accent);border-radius:8px;padding:7px 9px;margin:6px 0}
.opener{border-left:3px solid var(--brand);padding:6px 10px;margin:8px 0;font-size:14px;background:var(--bg);border-radius:0 8px 8px 0}
.row{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:700px){.row{grid-template-columns:220px 1fr}}
textarea{min-height:42px;resize:vertical}
details{font-size:13px;color:var(--muted);margin-top:6px}
details a{color:var(--brand);word-break:break-all}
.more{display:block;margin:16px auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>KNX Partner Leads · Elektrobetriebe Südbayern</h1>
  <div class="sub">Data collected __DATE__ · <span id="savemode">status &amp; notes are saved in this browser (use “Backup” to keep them)</span></div>
  <div class="counters" id="counters"></div>
</header>
<button class="btn ftoggle" id="ftoggle">Filters ▾</button>
<div class="filters" id="filters">
  <input class="search" id="q" type="search" placeholder="Search name, town, owner, phone, notes …">
  <select id="f-region"><option value="">All regions</option></select>
  <select id="f-town"><option value="">All towns</option></select>
  <select id="f-knx"><option value="">All KNX status</option></select>
  <select id="f-prio"><option value="">All priorities</option><option value="5">5</option><option value="4">4+</option><option value="3">3+</option><option value="2">2+</option></select>
  <select id="f-method"><option value="">All channels</option></select>
  <select id="f-status"><option value="">All statuses</option></select>
  <select id="f-sort">
    <option value="prio">Sort: priority</option><option value="dist">Sort: distance from Gersthofen</option>
    <option value="name">Sort: name</option><option value="town">Sort: town</option><option value="recent">Sort: last edited</option>
  </select>
</div>
<div class="bar">
  <span class="count" id="count"></span>
  <span style="flex:1"></span>
  <button class="btn" id="reset">Reset filters</button>
  <button class="btn primary" id="csv">Export view (CSV)</button>
  <button class="btn" id="backup">Backup</button>
  <label class="btn">Restore<input type="file" id="restore" accept=".json" hidden></label>
</div>
<main id="list"></main>
<button class="btn more" id="more">Show more</button>
<div class="toast" id="toast"></div>
<script>
const DATA = /*__DATA__*/[];
const STATUSES = ["not contacted","called – no answer","call back","interested","not interested","partner"];
const KEY = "knxLeads.v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
// In claude.ai the page gets a private per-account store (db); a local file keeps using localStorage.
let remote = null, writeTimers = {}, writing = {};
async function writeRemote(id){
  if (!remote) return;
  if (writing[id]) { writing[id] = "again"; return; }
  writing[id] = true;
  try { await remote.col.doc(id).set({ ...(store[id] || {}) }); }
  catch (e) { toast(e && e.code === "quota_exceeded" ? "Storage full: could not save" : "Could not sync, saved on this device"); }
  const again = writing[id] === "again"; writing[id] = false;
  if (again) writeRemote(id);
}
function save(id, delay=0){
  saveLocal();
  if (!remote || !id) return;
  clearTimeout(writeTimers[id]);
  writeTimers[id] = setTimeout(() => writeRemote(id), delay);
}
async function initRemote(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = db && user ? await user.id() : null;
    if (!uid) return;
    const col = db.collection("data/users/" + uid);
    remote = { col };
    let first = true;
    col.onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === "removed") { delete store[ch.doc.id]; return; }
        const d = ch.doc.data(); if (d && !writing[ch.doc.id]) store[ch.doc.id] = { ...d };
      });
      saveLocal();
      if (first) { first = false; $("savemode").textContent = "status & notes are saved to your Claude account and sync across devices"; }
      if (!document.activeElement || !document.activeElement.classList.contains("notes")) render(); else counters();
    }, () => { remote = null; $("savemode").textContent = "sync unavailable, status & notes are saved in this browser"; });
  } catch (e) { remote = null; }
}
const st = id => (store[id] && store[id].status) || "not contacted";
const notes = id => (store[id] && store[id].notes) || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tel = p => "tel:" + String(p).replace(/\(0\)/g,"").replace(/[^\d+]/g,"");
const url = u => /^https?:/i.test(u) ? u : "http://" + u;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

function fillSelect(id, values){ const s=$(id); values.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=v; s.appendChild(o); }); }
const uniq = a => [...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de"));
fillSelect("f-region", uniq(DATA.map(d=>d.region)));
fillSelect("f-knx", uniq(DATA.map(d=>d.knx_status)));
fillSelect("f-method", uniq(DATA.map(d=>d.contact_method)));
fillSelect("f-status", STATUSES);
function refreshTowns(){
  const r=$("f-region").value, s=$("f-town"), cur=s.value;
  s.innerHTML='<option value="">All towns</option>';
  fillSelect("f-town", uniq(DATA.filter(d=>!r||d.region===r).map(d=>d.town)));
  s.value=[...s.options].some(o=>o.value===cur)?cur:"";
}
refreshTowns();

const FKEY="knxLeads.filters";
const fids=["q","f-region","f-town","f-knx","f-prio","f-method","f-status","f-sort"];
try { const f=JSON.parse(localStorage.getItem(FKEY)||"{}"); fids.forEach(i=>{ if(f[i]!=null){ $(i).value=f[i]; if(i==="f-region") refreshTowns(); } }); } catch(e){}

let view=[], shown=0; const PAGE=40;
function filtered(){
  const q=$("q").value.trim().toLowerCase(), r=$("f-region").value, t=$("f-town").value, k=$("f-knx").value,
        p=+$("f-prio").value||0, m=$("f-method").value, s=$("f-status").value, sort=$("f-sort").value;
  let out=DATA.filter(d=>(!r||d.region===r)&&(!t||d.town===t)&&(!k||d.knx_status===k)&&(!p||d.priority>=p)&&
    (!m||d.contact_method===m)&&(!s||st(d.id)===s)&&
    (!q||[d.name,d.town,d.owner,d.phone_landline,d.phone_mobile,d.email,d.postcode,notes(d.id),(d.services||[]).join(" ")].join(" ").toLowerCase().includes(q)));
  const cmp={prio:(a,b)=>b.priority-a.priority||a.dist_gersthofen-b.dist_gersthofen,
    dist:(a,b)=>a.dist_gersthofen-b.dist_gersthofen, name:(a,b)=>a.name.localeCompare(b.name,"de"),
    town:(a,b)=>(a.town||"").localeCompare(b.town||"","de")||b.priority-a.priority,
    recent:(a,b)=>((store[b.id]||{}).t||0)-((store[a.id]||{}).t||0)}[sort];
  return out.sort(cmp);
}
function counters(){
  const c={}, reg={}; DATA.forEach(d=>{ reg[d.region]=(reg[d.region]||0)+1; const s=st(d.id); c[s]=(c[s]||0)+1; });
  const chips=[`<span class="chip" data-k="" data-v=""><b>${DATA.length}</b> total</span>`]
    .concat(Object.entries(reg).sort().map(([k,v])=>`<span class="chip ${$("f-region").value===k?"on":""}" data-k="f-region" data-v="${esc(k)}">${esc(k)} <b>${v}</b></span>`))
    .concat(STATUSES.map(s=>`<span class="chip ${$("f-status").value===s?"on":""}" data-k="f-status" data-v="${esc(s)}">${esc(s)} <b>${c[s]||0}</b></span>`));
  $("counters").innerHTML=chips.join("");
}
function card(d){
  const tags=[`<span class="tag knx">${esc(d.knx_status)}</span>`];
  if(d.knx_specialist) tags.push('<span class="tag warn">KNX/smart-home specialist</span>');
  if(d.meister==="yes") tags.push('<span class="tag">Meisterbetrieb</span>');
  (d.services||[]).forEach(s=>tags.push(`<span class="tag">${esc(s)}</span>`));
  if(d.data_quality!=="complete") tags.push(`<span class="tag warn">${esc(d.data_quality)}</span>`);
  if(d.gs_rating) tags.push(`<span class="tag">GS ★ ${d.gs_rating} (${d.gs_reviews||0})</span>`);
  const acts=[];
  if(d.phone_landline) acts.push(`<a class="call" href="${tel(d.phone_landline)}">📞 ${esc(d.phone_landline)}</a><button class="btn cp" data-v="${esc(d.phone_landline)}" aria-label="Copy number">Copy</button>`);
  if(d.phone_mobile) acts.push(`<a class="${d.phone_landline?"":"call"}" href="${tel(d.phone_mobile)}">📱 ${esc(d.phone_mobile)}</a><button class="btn cp" data-v="${esc(d.phone_mobile)}" aria-label="Copy number">Copy</button>`);
  if(d.email) acts.push(`<a href="mailto:${esc(d.email)}">✉ ${esc(d.email)}</a>`);
  if(d.website) acts.push(`<a href="${esc(url(d.website))}" target="_blank" rel="noopener">Website</a>`);
  if(d.contact_form && d.contact_form!==d.website) acts.push(`<a href="${esc(d.contact_form)}" target="_blank" rel="noopener">Contact form</a>`);
  const opts=STATUSES.map(s=>`<option ${s===st(d.id)?"selected":""}>${esc(s)}</option>`).join("");
  return `<div class="card" data-id="${d.id}">
   <div class="top"><div class="prio p${d.priority}" title="Priority">${d.priority}</div>
    <div><div class="name">${esc(d.name)}</div>
    <div class="meta">${esc([d.street,[d.postcode,d.town].filter(Boolean).join(" ")].filter(Boolean).join(", "))} · ${esc(d.region)} · ${d.dist_gersthofen} km von Gersthofen</div>
    <div class="meta">${d.owner?"Kontakt: "+esc(d.owner)+" · ":""}${esc(d.legal_form||"")}${d.legal_form?" · ":""}${esc(d.size||"")}</div></div></div>
   <div class="tags">${tags.join("")}</div>
   <div class="actions">${acts.join("")||'<span class="meta">No contact details found</span>'}</div>
   <div class="rec"><b>${esc(d.contact_method)}</b> – ${esc(d.contact_reason)}<br>Best time: ${esc(d.best_time)}</div>
   <div class="opener">${esc(d.opener)}</div>
   <div class="row"><select class="status">${opts}</select><textarea class="notes" placeholder="Notes …">${esc(notes(d.id))}</textarea></div>
   <div class="actions"><button class="btn copy">Copy opener</button></div>
   <details><summary>Sources &amp; details</summary>
    ${d.knx_snippet?`<p>KNX on site: “${esc(d.knx_snippet)}”</p>`:""}
    ${(d.brands||[]).length?`<p>Brands: ${esc(d.brands.join(", "))}</p>`:""}
    ${d.impressum_url?`<p><a href="${esc(d.impressum_url)}" target="_blank" rel="noopener">Impressum</a></p>`:""}
    <p>${(d.source_urls||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,"").slice(0,48))}</a>`).join("<br>")}</p>
   </details></div>`;
}
function render(reset=true){
  if(reset){ view=filtered(); shown=0; $("list").innerHTML=""; }
  const chunk=view.slice(shown, shown+PAGE); shown+=chunk.length;
  $("list").insertAdjacentHTML("beforeend", chunk.map(card).join(""));
  $("count").textContent=`${view.length} shown of ${DATA.length}`;
  $("more").style.display=shown<view.length?"block":"none";
  counters();
  try { const f={}; fids.forEach(i=>f[i]=$(i).value); localStorage.setItem(FKEY, JSON.stringify(f)); } catch(e){}
}
fids.forEach(i=>$(i).addEventListener(i==="q"?"input":"change",()=>{ if(i==="f-region") refreshTowns(); render(); }));
$("more").onclick=()=>render(false);
$("reset").onclick=()=>{ fids.forEach(i=>$(i).value=i==="f-sort"?"prio":""); refreshTowns(); render(); };
$("counters").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  if(!c.dataset.k){ $("f-region").value=""; $("f-status").value=""; }
  else $(c.dataset.k).value = $(c.dataset.k).value===c.dataset.v ? "" : c.dataset.v;
  refreshTowns(); render(); });
$("list").addEventListener("change",e=>{ const card=e.target.closest(".card"); if(!card||!e.target.classList.contains("status")) return;
  const id=card.dataset.id; store[id]={...(store[id]||{}),status:e.target.value,t:Date.now()}; save(id); counters(); toast("Status saved"); });
$("list").addEventListener("input",e=>{ const card=e.target.closest(".card"); if(!card||!e.target.classList.contains("notes")) return;
  const id=card.dataset.id; store[id]={...(store[id]||{}),notes:e.target.value,t:Date.now()}; save(id, 800); });
function copyText(text, msg){
  const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); toast(msg); };
  try { navigator.clipboard.writeText(text).then(()=>toast(msg), fallback); } catch(err){ fallback(); }
}
$("list").addEventListener("click",e=>{
  if(e.target.classList.contains("cp")) { copyText(e.target.dataset.v, "Number copied"); return; }
  if(!e.target.classList.contains("copy")) return;
  const d=DATA.find(x=>x.id===e.target.closest(".card").dataset.id);
  copyText(d.opener, "Opener copied"); });
let downloads=null;
async function download(name, text, type){
  if (downloads) {
    try { await downloads.save({filename:name, data:text}); toast("Saved"); }
    catch(e){ if(e && e.code!=="declined") toast("Could not save the file here"); }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("csv").onclick=()=>{
  const cols=["priority","name","owner","street","postcode","town","region","dist_gersthofen","phone_landline","phone_mobile","email","website","contact_form","knx_status","meister","size","contact_method","best_time","opener"];
  const q=v=>'"'+String(Array.isArray(v)?v.join("; "):v??"").replace(/"/g,'""')+'"';
  const rows=[cols.concat(["status","notes"]).join(";")].concat(view.map(d=>cols.map(c=>q(d[c])).concat([q(st(d.id)),q(notes(d.id))]).join(";")));
  download(`knx-leads-${new Date().toISOString().slice(0,10)}.csv`, "﻿"+rows.join("\n"), "text/csv;charset=utf-8");
};
$("backup").onclick=()=>download(`knx-leads-status-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(store), "application/json");
$("restore").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(async t=>{ let add; try { add=JSON.parse(t); } catch(err){ toast("Invalid file"); return; }
  store={...store,...add}; saveLocal(); render(); toast("Restored");
  for (const id of Object.keys(add)) { if (remote) await writeRemote(id); } }); };
$("ftoggle").onclick=()=>{ const f=$("filters"); f.classList.toggle("collapsed"); $("ftoggle").textContent=f.classList.contains("collapsed")?"Filters ▾":"Filters ▴"; };
$("filters").classList.add("collapsed");
render();
initRemote();
if (window.claude && window.claude.use) claude.use("downloads").then(d=>{ downloads=d; }).catch(()=>{});
</script>
</body>
</html>
